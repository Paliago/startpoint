[workspace]
members = ["crates/sdk", "crates/core", "crates/desktop"]
default-members = ["crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
startpoint-sdk = { path = "crates/sdk" }
startpoint-core = { path = "crates/core" }
async-channel = "2.5"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
