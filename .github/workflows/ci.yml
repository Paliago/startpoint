name: CI
run-name: CI — ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: Check formatting
        run: cargo fmt --all -- --check

  windows-tests:
    name: Windows desktop tests
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          "compiler=$(rustc --version)" >> $env:GITHUB_OUTPUT
      - name: Configure Windows shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -File | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler not found.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Cache Rust dependencies and test builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ci-win-x64-debug-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-win-x64-debug-${{ steps.rust.outputs.compiler }}-
      - name: Test workspace and updater
        run: cargo test --locked --workspace --features self-update
