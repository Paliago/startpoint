name: Release
run-name: Release — ${{ inputs.tag || github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (blank previews main without publishing)
        required: false
        type: string
      publish:
        description: Publish all platforms together after validation (requires a tag)
        default: false
        type: boolean
      allow_unsigned:
        description: Explicitly allow an unsigned testing release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: startpoint-release
  cancel-in-progress: false

env:
  STARTPOINT_RELEASE_REPOSITORY: ${{ vars.STARTPOINT_RELEASE_REPOSITORY || github.repository }}
  VPK_VERSION: '1.2.161'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      publish: ${{ steps.metadata.outputs.publish }}
      policy: ${{ steps.metadata.outputs.policy }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Validate version, main ancestry and release policy
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          PUBLISH_REQUESTED: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish || false }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned || false }}
        run: python scripts/release.py metadata --vpk-version "$VPK_VERSION"

  build:
    needs: prepare
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-2022
            toolchain: stable-x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - platform: osx-arm64
            runner: macos-15
            toolchain: stable-aarch64-apple-darwin
            rustflags: ''
          - platform: osx-x64
            runner: macos-15-intel
            toolchain: stable-x86_64-apple-darwin
            rustflags: ''
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_POLICY: ${{ needs.prepare.outputs.policy }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      STARTPOINT_SIGNING_METADATA_JSON: ${{ vars.STARTPOINT_SIGNING_METADATA_JSON }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      MACOS_APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_BASE64 }}
      MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APP_SIGNING_IDENTITY: ${{ vars.MACOS_APP_SIGNING_IDENTITY }}
      MACOS_INSTALLER_SIGNING_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate signing configuration before building
        run: python scripts/release.py signing --platform "$RELEASE_PLATFORM" --policy "$RELEASE_POLICY"
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          echo "compiler=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Configure Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -File | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler not found.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-v2-${{ matrix.platform }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}
      - name: Test workspace and updater
        run: cargo test --locked --workspace --features self-update
      - name: Build release executable
        run: cargo build --locked --release --features self-update
      - name: Install packaging SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned packaging CLI
        run: dotnet tool install vpk --version "$VPK_VERSION" --tool-path "$RUNNER_TEMP/vpk"
      - name: Package and verify installer, portable app and update feed
        run: >-
          python scripts/release.py package --platform "$RELEASE_PLATFORM"
          --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --policy "$RELEASE_POLICY"
          --vpk "$RUNNER_TEMP/vpk/vpk" --output "$RUNNER_TEMP/packages"
      - name: Upload platform packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep Windows crash symbols separate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-win-x64
          path: target/release/startpoint.pdb
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Assemble all platforms and publish once
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_POLICY: ${{ needs.prepare.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/downloaded
      - name: Validate every platform and generate checksums
        run: >-
          python scripts/release.py assemble --packages "$RUNNER_TEMP/downloaded"
          --output "$RUNNER_TEMP/release" --version "$RELEASE_VERSION"
          --commit "$RELEASE_COMMIT" --policy "$RELEASE_POLICY"
      - name: Upload complete installable release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startpoint-${{ needs.prepare.outputs.tag }}-all-platforms
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish draft only after all uploads succeed
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.STARTPOINT_RELEASE_TOKEN || github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/release.py publish --output "$RUNNER_TEMP/release"
          --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
          --repository "$STARTPOINT_RELEASE_REPOSITORY" --source-repository "$SOURCE_REPOSITORY"
