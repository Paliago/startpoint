name: Windows release
run-name: Windows release — ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish to the public releases repository (otherwise artifacts only)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
  RUSTFLAGS: -C target-feature=+crt-static
  STARTPOINT_RELEASE_REPOSITORY: ${{ vars.STARTPOINT_RELEASE_REPOSITORY || github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  VPK_VERSION: '1.2.161'

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate public release destination
        shell: pwsh
        run: |
          if ($env:STARTPOINT_RELEASE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'Set STARTPOINT_RELEASE_REPOSITORY to a public owner/repository in Actions variables.'
          }
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Release tags must be stable versions such as v0.1.0 (no prerelease/build suffix).'
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          try {
            # Deliberately unauthenticated: the installed app must be able to read this too.
            $repository = Invoke-RestMethod "https://api.github.com/repos/$env:STARTPOINT_RELEASE_REPOSITORY"
            if ($repository.private) { throw 'Release destination must be public.' }
          } catch {
            throw 'Release repository is not anonymously readable. Create a public releases-only repository and set STARTPOINT_RELEASE_REPOSITORY plus STARTPOINT_RELEASE_TOKEN.'
          }

      - name: Install Rust
        run: rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Configure Windows SDK and validate version
        id: environment
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler fxc.exe was not found.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          "compiler=$(rustc --version)" >> $env:GITHUB_OUTPUT
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }
          $package = $metadata.packages | Where-Object { $_.name -eq 'startpoint' }
          if ($package.version -ne $env:RELEASE_VERSION) {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $($package.version). Update workspace.package.version before tagging."
          }
          git log -1 --format="%H %s"
          "RELEASE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-updater-release-${{ steps.environment.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}

      - name: Test workspace and updater
        run: cargo test --locked --workspace --release --features self-update

      - name: Build executable
        run: cargo build --locked --release --features self-update

      - name: Install packaging SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned Velopack CLI
        shell: pwsh
        run: |
          # .NET is a packaging-time tool only, not an end-user dependency.
          dotnet tool install vpk --version $env:VPK_VERSION --tool-path "$env:RUNNER_TEMP\vpk"

      - name: Package installer, portable app and update feed
        shell: pwsh
        env:
          SIGNING_METADATA_JSON: ${{ vars.STARTPOINT_SIGNING_METADATA_JSON }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # Keep packaging self-contained: local .ps1 helpers are not tracked.
          $stage = "$env:RUNNER_TEMP\startpoint-stage"
          $output = "$env:RUNNER_TEMP\startpoint-release"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath target/release/startpoint.exe -Destination "$stage\startpoint.exe"
          $arguments = @(
            'pack', '--packId', 'Paliago.Startpoint.App', '--packTitle', 'Startpoint',
            '--packVersion', $env:RELEASE_VERSION, '--packDir', $stage,
            '--mainExe', 'startpoint.exe', '--runtime', 'win-x64',
            '--channel', 'win-x64-stable', '--outputDir', $output,
            '--icon', (Join-Path $PWD 'crates/desktop/assets/icons/startpoint.ico')
          )
          if ($env:SIGNING_METADATA_JSON) {
            $signingFile = "$env:RUNNER_TEMP\startpoint-signing.json"
            $env:SIGNING_METADATA_JSON | Set-Content -LiteralPath $signingFile -Encoding utf8
            $arguments += @('--azureTrustedSignFile', $signingFile)
          } else {
            Write-Warning 'This release is unsigned. Configure code signing before broad public distribution.'
          }
          & "$env:RUNNER_TEMP\vpk\vpk.exe" @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Velopack packaging failed.' }
          $feed = Get-Content "$output\releases.win-x64-stable.json" -Raw | ConvertFrom-Json
          $full = @($feed.Assets | Where-Object { $_.Type -eq 'Full' })
          if ($full.Count -ne 1 -or $full[0].Version -ne $env:RELEASE_VERSION -or $full[0].PackageId -ne 'Paliago.Startpoint.App') {
            throw 'The packaged feed has an unexpected app ID or version.'
          }
          $asset = $full[0]
          if ($asset.FileName -notmatch '^[A-Za-z0-9_.-]+-full\.nupkg$' -or $asset.FileName.Contains('..')) {
            throw 'The package has an unsafe filename.'
          }
          $package = Join-Path $output $asset.FileName
          if ((Get-Item -LiteralPath $package).Length -ne $asset.Size -or
              (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ne $asset.SHA256) {
            throw 'The package does not match its release feed hash/size.'
          }

      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startpoint-${{ env.RELEASE_TAG }}-windows-x64
          path: ${{ runner.temp }}/startpoint-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Keep matching crash symbols separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startpoint-${{ env.RELEASE_TAG }}-crash-symbols
          path: target/release/startpoint.pdb
          if-no-files-found: warn
          retention-days: 30

      - name: Publish complete release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STARTPOINT_RELEASE_TOKEN || github.token }}
        run: |
          try {
            $latest = Invoke-RestMethod "https://github.com/$env:STARTPOINT_RELEASE_REPOSITORY/releases/latest/download/releases.win-x64-stable.json"
            $newerOrEqual = @($latest.Assets | Where-Object {
              $_.Type -eq 'Full' -and [version]$_.Version -ge [version]$env:RELEASE_VERSION
            })
            if ($newerOrEqual.Count) { throw 'A same/newer version is already published; do not move the stable feed backwards.' }
          } catch {
            # A missing feed is expected for the first release, not for other failures.
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          gh release view $env:RELEASE_TAG --repo $env:STARTPOINT_RELEASE_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite published update packages.' }
          $notes = "Windows x64 installer and self-updating portable package.`n`nSource: https://github.com/${{ github.repository }}/commit/$env:RELEASE_COMMIT`n`nUpdates download in the background and take effect after restarting Startpoint."
          $assets = @(Get-ChildItem "$env:RUNNER_TEMP\startpoint-release" -File | Where-Object { $_.Extension -in '.exe', '.zip', '.nupkg', '.json' } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw 'Release assets are incomplete.' }
          # A draft cannot become the latest feed while assets are still uploading.
          gh release create $env:RELEASE_TAG --repo $env:STARTPOINT_RELEASE_REPOSITORY --draft --title "Startpoint $env:RELEASE_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release. For a separate repository, set STARTPOINT_RELEASE_TOKEN with Contents write permission there.' }
          gh release upload $env:RELEASE_TAG @assets --repo $env:STARTPOINT_RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --repo $env:STARTPOINT_RELEASE_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
