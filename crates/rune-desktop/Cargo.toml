[package]
name = "startpoint-rune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
startpoint-core = { workspace = true, features = ["automation"] }
startpoint-sdk.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
num-traits = "0.2"
chrono = "0.4.45"
wgpu = { version = "~30.0.1", default-features = false }
tempfile = "3.27"
open = "5.3"
uuid = { version = "1.18", features = ["v4"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["markdown"] }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
