[package]
name = "startpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "startpoint"

[features]
dev-icon = []
production-branding = []
self-update = ["dep:velopack", "dep:semver"]

[dependencies]
startpoint-core = { workspace = true, features = ["automation"] }
startpoint-sdk.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
num-traits = "0.2"
chrono = "0.4.45"
wgpu = { version = "~30.0.1", default-features = false }
tempfile = "3.27"
open = "5.3"
uuid = { version = "1.18", features = ["v4"] }
log = "=0.4.34"
semver = { version = "1.0", optional = true }
velopack = { version = "=1.2.161", features = ["public-utils"], optional = true }
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["markdown"] }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "=0.45.1", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
wgpu = { version = "~30.0.1", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["vulkan", "gles"] }
