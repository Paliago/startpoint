[package]
name = "startpoint"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
default-run = "startpoint"

[features]
runtime-shaders = ["gpui_platform/runtime_shaders"]
self-update = ["dep:velopack", "dep:semver", "dep:async-channel"]

[dependencies]
startpoint-sdk.workspace = true
startpoint-core.workspace = true
serde_json.workspace = true
chrono = "0.4"
# Keep renderer and components on the tested, matching Zeron revisions.
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/zeronsh/gpui-component", rev = "701ca97af7983bf85343d2d1d404ab528b18ec96" }
gpui-component-assets = { git = "https://github.com/zeronsh/gpui-component", rev = "701ca97af7983bf85343d2d1d404ab528b18ec96" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"
log = "=0.4.34"
async-channel = { workspace = true, optional = true }
semver = { version = "1.0", optional = true }
velopack = { version = "=1.2.161", features = ["public-utils"], optional = true }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
resvg = { version = "=0.45.1", default-features = false }
tempfile = "3.27"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSAppearance", "NSWorkspace", "NSAccessibility", "NSEvent", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }
